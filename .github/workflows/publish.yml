name: Publish dashboard
# Runs the tracker once (NSE only; BSE blocks GitHub's servers) and deploys the static page to GitHub Pages.
on:
  schedule:
    - cron: "*/5 1-19 * * *"       # every 5 min, 06:30-01:30 IST (cron is UTC; GitHub may delay runs)
    - cron: "*/30 0,20-23 * * *"   # every 30 min overnight
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["earnings_tracker.py", "static/**", "hosted_watchlist.txt", ".github/workflows/publish.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Restore season state and daily masters
        uses: actions/cache/restore@v4
        with:
          path: |
            data/*.json
            data/*.csv
          key: season-${{ github.run_id }}
          restore-keys: season-
      - name: Run one cycle
        run: python earnings_tracker.py --snapshot _site --no-bse --watch-file hosted_watchlist.txt
      - name: Save season state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/*.json
            data/*.csv
          key: season-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
